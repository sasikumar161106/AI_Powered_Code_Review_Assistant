services:
  - type: web
    name: ai-code-reviewer
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEFAULT_LLM_PROVIDER
        value: gemini
